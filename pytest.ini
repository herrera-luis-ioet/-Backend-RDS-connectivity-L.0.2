[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --cov=app --cov-report=term-missing
markers =
    unit: Unit tests
    integration: Integration tests
    models: Model tests
    api: API tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning